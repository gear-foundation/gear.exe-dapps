[workspace]
resolver = "2"

members = [
    "arkanoid/vara-eth/",
    "arkanoid/vara-eth/client",
    "cnn-cats-dogs",
    "cnn-cats-dogs/client",
    "digit-recognition",
    "digit-recognition/client",
    "mandelbrot-set/manager",
    "mandelbrot-set/manager/client",
    "mandelbrot-set/mandelbrot-checker",
    "mandelbrot-set/mandelbrot-checker/client",
]

[workspace.package]
homepage = "https://wiki.gear-tech.io/docs/examples/prerequisites"
authors = ["Gear Foundation <hello@gear.foundation>"]
version = "1.1.0"
license = "MIT"
edition = "2021"
publish = false

[workspace.dependencies]
gstd = "=1.10.0"
gclient = "=1.10.0"
gear-core = "=1.10.0"
sails-rs = "=0.10.2"
sails-idl-gen = "=0.10.2"
sails-client-gen = "=0.10.2"
log = "*"
env_logger = "*"
tokio = { version = "1.41", features = ["rt", "macros"] }
scale-info = { version = "2", default-features = false }
parity-scale-codec = { version = "3", default-features = false }